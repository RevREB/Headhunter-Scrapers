name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./...
  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scraper: [example, greenhouse, lever, ashby, workday]     # add a Tier-2 scraper dir name here to publish it
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tier2/${{ matrix.scraper }}/Dockerfile
          push: true
          tags: ghcr.io/revreb/headhunter-scraper-${{ matrix.scraper }}:build-${{ github.run_number }}
