name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # No root Go module: each module (and scraperkit) is its own module, so test each in place.
      - run: |
          set -e
          for d in scraperkit modules/*/; do
            if [ -f "$d/go.mod" ]; then echo "== test $d =="; (cd "$d" && go test ./...); fi
          done
  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [greenhouse, lever, ashby, workday, amazon, apple]     # add a module dir name here to publish it
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/${{ matrix.module }}/Dockerfile
          push: true
          tags: ghcr.io/revreb/headhunter-scraper-${{ matrix.module }}:build-${{ github.run_number }}
