# Headhunter scraper library — the set of ATS scrapers.
#
# NOTE: this file documents the available scrapers. The OPERATIVE catalog that
# Core's operator actually runs is the RevNet ConfigMap
# (apps/headhunter/scan-catalog.yaml) — it carries image tags + per-scraper
# company lists and is curated there.
#
# Every current scraper is Tier-2: a container image run as a one-shot Kubernetes
# Job by Core's operator. Tier-1 (declarative manifests interpreted by a shared
# runner) is a planned addition — see tier1/greenhouse.yaml for the target format.
scrapers:
  - ats: greenhouse
    image: ghcr.io/revreb/headhunter-scraper-greenhouse
  - ats: lever
    image: ghcr.io/revreb/headhunter-scraper-lever
  - ats: ashby
    image: ghcr.io/revreb/headhunter-scraper-ashby
  - ats: workday
    image: ghcr.io/revreb/headhunter-scraper-workday
  - ats: amazon            # custom-company (amazon.jobs), not a standard ATS
    image: ghcr.io/revreb/headhunter-scraper-amazon
  - ats: apple             # custom-company; DEFERRED — jobs.apple.com is CSRF/bot-gated (HTTP 436)
    image: ghcr.io/revreb/headhunter-scraper-apple
    status: deferred
